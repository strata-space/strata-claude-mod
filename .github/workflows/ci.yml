name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mod:
    name: validate and test the mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: validate JSON syntax
        run: |
          jq empty .claude-plugin/plugin.json
          jq empty hooks/hooks.json
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
      - name: install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: claude plugin validate (manifest, hooks module and what it calls)
        run: claude plugin validate .
      - name: claude plugin test (hooks module)
        # Hooks modules are rolling out in Claude Code; a build without them has
        # no `plugin test` and loads the plugin without the module. Run the tests
        # where the command exists, and say so where it does not.
        run: |
          if claude plugin --help 2>&1 | grep -Eq '^\s+test\b'; then
            claude plugin test .
          else
            echo "::notice::this Claude Code build has no 'claude plugin test' (hooks modules not enabled); the hooks module's tests were not run"
          fi
